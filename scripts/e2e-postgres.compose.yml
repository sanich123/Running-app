services:
  db:
    image: postgres:18.6
    command: ['postgres', '-c', 'timezone=UTC']
    restart: always
    environment:
      POSTGRES_USER: ${RUNICH_E2E_DB_USER}
      POSTGRES_PASSWORD: ${RUNICH_E2E_DB_PASSWORD}
      POSTGRES_DB: ${RUNICH_E2E_DB_NAME}
    ports:
      - '127.0.0.1:${RUNICH_E2E_DB_PORT}:5432'
    volumes:
      - runich-e2e-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  runich-e2e-pgdata:
    name: runich-e2e-pgdata
