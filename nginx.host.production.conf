# Managed by Runich web deploy workflow.
server {
    listen 80;
    server_name runich-app.ru;

    root /opt/runich-web-production/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/runich-app-acme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name runich-app.ru;

    ssl_certificate /etc/letsencrypt/live/runich-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runich-app.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/runich-web-production/current;
    index index.html;

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ^~ /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|mjs|png|svg|ttf|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
