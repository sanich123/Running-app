[build]
  command = "yarn web:export:production"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26.7.0"

[context.branch-deploy]
  command = "yarn web:export:stage"

[context.stage]
  command = "yarn web:export:stage"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"
